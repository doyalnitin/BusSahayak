<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusSahayak Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 60px;
    padding: 40px;
  }

  .logo-container {
    text-align: center;
  }

  .logo-label {
    font-size: 14px;
    color: #64748b;
    margin-top: 16px;
    font-weight: 600;
  }

  /* Logo 1: Bus + Voice Wave */
  .logo-1 {
    width: 200px;
    height: 200px;
    position: relative;
  }

  /* Logo 2: Circle Badge */
  .logo-2 {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 10px 40px rgba(37, 99, 235, 0.3);
  }

  /* Logo 3: Minimal Icon */
  .logo-3 {
    width: 200px;
    height: 200px;
    background: #f8fafc;
    border: 3px solid #2563eb;
    border-radius: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Logo 4: Gradient Square */
  .logo-4 {
    width: 200px;
    height: 200px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #ec4899 100%);
    border-radius: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 10px 40px rgba(37, 99, 235, 0.4);
  }

  .logo-text {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
    letter-spacing: -0.5px;
  }

  .logo-sub {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 2px;
    font-weight: 500;
  }

  .bus-icon {
    font-size: 60px;
    line-height: 1;
  }

  .voice-waves {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 8px;
  }

  .wave {
    width: 4px;
    background: white;
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite;
  }

  .wave:nth-child(1) { height: 12px; animation-delay: 0s; }
  .wave:nth-child(2) { height: 20px; animation-delay: 0.1s; }
  .wave:nth-child(3) { height: 16px; animation-delay: 0.2s; }
  .wave:nth-child(4) { height: 24px; animation-delay: 0.3s; }
  .wave:nth-child(5) { height: 12px; animation-delay: 0.4s; }

  @keyframes wave {
    50% { height: 8px; }
  }

  .mic-icon {
    font-size: 40px;
    margin-bottom: 4px;
  }

  .hindi-text {
    font-size: 18px;
    font-weight: 700;
    margin-top: 4px;
  }

  .hindi-sub {
    font-size: 10px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<!-- Logo 1: SVG Bus + Voice -->
<div class="logo-container">
  <svg class="logo-1" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#2563eb"/>
        <stop offset="100%" style="stop-color:#7c3aed"/>
      </linearGradient>
    </defs>
    <!-- Circle Background -->
    <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
    <!-- Bus Body -->
    <rect x="40" y="65" width="120" height="60" rx="12" fill="white"/>
    <!-- Bus Windows -->
    <rect x="52" y="75" width="28" height="20" rx="4" fill="#3b82f6"/>
    <rect x="86" y="75" width="28" height="20" rx="4" fill="#3b82f6"/>
    <rect x="120" y="75" width="28" height="20" rx="4" fill="#3b82f6"/>
    <!-- Bus Wheels -->
    <circle cx="65" cy="135" r="12" fill="white"/>
    <circle cx="65" cy="135" r="6" fill="#3b82f6"/>
    <circle cx="135" cy="135" r="12" fill="white"/>
    <circle cx="135" cy="135" r="6" fill="#3b82f6"/>
    <!-- Voice Waves -->
    <path d="M155 80 Q165 100 155 120" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M165 70 Q180 100 165 130" stroke="white" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M175 60 Q195 100 175 140" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- Text -->
    <text x="100" y="170" text-anchor="middle" fill="white" font-size="16" font-weight="800" font-family="Segoe UI">BusSahayak</text>
  </svg>
  <div class="logo-label">Logo Option 1</div>
</div>

<!-- Logo 2: Circle Badge -->
<div class="logo-container">
  <div class="logo-2">
    <div class="bus-icon">🚌</div>
    <div class="voice-waves">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <div class="hindi-text">बस सहायक</div>
    <div class="hindi-sub">Voice-First Bus Booking</div>
  </div>
  <div class="logo-label">Logo Option 2</div>
</div>

<!-- Logo 3: Minimal -->
<div class="logo-container">
  <div class="logo-3">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <rect x="10" y="20" width="60" height="35" rx="8" fill="#2563eb"/>
      <rect x="18" y="27" width="14" height="12" rx="3" fill="white"/>
      <rect x="36" y="27" width="14" height="12" rx="3" fill="white"/>
      <rect x="54" y="27" width="10" height="12" rx="3" fill="white"/>
      <circle cx="25" cy="60" r="7" fill="#2563eb"/>
      <circle cx="25" cy="60" r="3" fill="white"/>
      <circle cx="55" cy="60" r="7" fill="#2563eb"/>
      <circle cx="55" cy="60" r="3" fill="white"/>
      <!-- Microphone -->
      <circle cx="68" cy="15" r="8" fill="#7c3aed"/>
      <rect x="66" y="18" width="4" height="6" rx="2" fill="#7c3aed"/>
    </svg>
    <div style="font-size: 20px; font-weight: 800; color: #0f172a; margin-top: 8px;">BusSahayak</div>
    <div style="font-size: 10px; color: #64748b; font-weight: 600;">Voice-First Bus Booking</div>
  </div>
  <div class="logo-label">Logo Option 3</div>
</div>

<!-- Logo 4: Gradient -->
<div class="logo-container">
  <div class="logo-4">
    <div class="mic-icon">🎤</div>
    <div class="logo-text">बस सहायक</div>
    <div class="logo-sub">BusSahayak</div>
    <div style="font-size: 9px; opacity: 0.7; margin-top: 4px;">Voice-First | Accessible | Smart</div>
  </div>
  <div class="logo-label">Logo Option 4</div>
</div>

</body>
</html>
