<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BusSahayak Logo - Final</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px;
  }

  .logo-main {
    width: 300px;
    height: 300px;
    position: relative;
  }
</style>
</head>
<body>

<svg class="logo-main" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Circle Background -->
  <circle cx="150" cy="150" r="140" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Bus Body -->
  <rect x="55" y="90" width="140" height="75" rx="16" fill="white"/>
  
  <!-- Bus Windows -->
  <rect x="70" y="102" width="32" height="24" rx="5" fill="#3b82f6"/>
  <rect x="108" y="102" width="32" height="24" rx="5" fill="#3b82f6"/>
  <rect x="146" y="102" width="32" height="24" rx="5" fill="#3b82f6"/>
  
  <!-- Bus Door -->
  <rect x="178" y="102" width="12" height="45" rx="3" fill="#e5e7eb"/>
  
  <!-- Bus Wheels -->
  <circle cx="90" cy="175" r="16" fill="white"/>
  <circle cx="90" cy="175" r="8" fill="#3b82f6"/>
  <circle cx="160" cy="175" r="16" fill="white"/>
  <circle cx="160" cy="175" r="8" fill="#3b82f6"/>
  
  <!-- Voice Waves -->
  <path d="M205 100 Q220 130 205 160" stroke="white" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M220 85 Q240 130 220 175" stroke="white" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M235 70 Q260 130 235 190" stroke="white" stroke-width="4" fill="none" opacity="0.5"/>
  
  <!-- Microphone Icon -->
  <circle cx="240" cy="80" r="14" fill="white"/>
  <rect x="236" y="88" width="8" height="10" rx="4" fill="white"/>
  <path d="M230 98 Q240 108 250 98" stroke="white" stroke-width="3" fill="none"/>
  
  <!-- Text: BusSahayak -->
  <text x="150" y="225" text-anchor="middle" fill="white" font-size="28" font-weight="800" font-family="Segoe UI, sans-serif">BusSahayak</text>
  
  <!-- Text: Hindi -->
  <text x="150" y="250" text-anchor="middle" fill="white" font-size="16" font-weight="600" font-family="Segoe UI, sans-serif" opacity="0.9">बस सहायक</text>
  
  <!-- Subtitle -->
  <text x="150" y="270" text-anchor="middle" fill="white" font-size="11" font-weight="500" font-family="Segoe UI, sans-serif" opacity="0.7">Voice-First Bus Booking</text>
</svg>

</body>
</html>
